name: Update Strava Stats

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Refresh Strava Token
        id: refresh_token
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node get_tokens.js

      - name: Generate SVGs
        env:
          ACCESS_TOKEN: ${{ steps.refresh_token.outputs.access_token }}
          # Set your monthly goal here (km). You can also use ${{ vars.MONTHLY_GOAL_KM }} if configured.
          MONTHLY_GOAL_KM: 200
        run: |
          node generate_svg.js
          node generate_gear_svg.js
          node generate_comparison_svg.js
          node generate_goal_svg.js

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Strava stats widgets [skip ci]"
          file_pattern: "*.svg"
