name: Update Strava Stats

on:
  # Strava APIが2026年6月よりサブスクリプション必須化されたため、
  # 定期実行(schedule)は停止中。必要な場合は手動実行(workflow_dispatch)のみ。
  # schedule:
  #   - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Refresh Strava Token
        id: refresh_token
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node src/get_tokens.js

      - name: Generate SVGs
        env:
          ACCESS_TOKEN: ${{ steps.refresh_token.outputs.access_token }}
          MONTHLY_GOAL_KM: ${{ vars.MONTHLY_GOAL_KM }}
          WEEKLY_GOAL_KM: ${{ vars.WEEKLY_GOAL_KM }}
          WEEKLY_GOAL_HOURS: ${{ vars.WEEKLY_GOAL_HOURS }}
        run: |
          node src/generate_weekly_svg.js
          node src/generate_gear_svg.js
          node src/generate_comparison_svg.js
          node src/generate_goal_svg.js

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Strava stats widgets [skip ci]"
          file_pattern: "widgets/*.svg"
